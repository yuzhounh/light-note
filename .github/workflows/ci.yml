name: CI

on:
  push:
  pull_request:

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test and build embedded editor
        working-directory: editor
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      - name: Restore
        run: dotnet restore LightNote.slnx

      - name: Build
        run: dotnet build LightNote.slnx --configuration Release --no-restore

      - name: Test with coverage
        shell: pwsh
        run: |
          dotnet test tests/LightNote.Core.Tests/LightNote.Core.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/LightNote.IntegrationTests/LightNote.IntegrationTests.csproj --configuration Release --no-build --filter 'FullyQualifiedName!~MessageDialogTests&FullyQualifiedName!~SidebarContextMenuTests' --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Native WinRT activation needs the application's executable host; each UI suite also owns one WPF Application.
          $uiRunner = 'tests/LightNote.IntegrationTests/bin/Release/net10.0-windows10.0.19041.0/win-x64/LightNote.IntegrationTests.exe'
          foreach ($suite in @('message-dialog', 'sidebar', 'window-controls', 'title-editing')) {
            & $uiRunner $suite
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish self-contained application
        run: dotnet publish src/LightNote.App/LightNote.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/win-x64

      - name: Verify release payload
        shell: pwsh
        run: |
          $required = @(
            'artifacts/publish/win-x64/LightNote.exe',
            'artifacts/publish/win-x64/Microsoft.WindowsAppRuntime.dll',
            'artifacts/publish/win-x64/Microsoft.UI.Windowing.Core.dll',
            'artifacts/publish/win-x64/WinRT.Runtime.dll',
            'artifacts/publish/win-x64/Editor/index.html'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "发布产物缺少 $path"
            }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightnote-ci-artifacts
          path: |
            artifacts/test-results
            artifacts/publish/win-x64
