<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LightNote icon</title>
  <desc id="desc">Three dark-green note lines crossed by a short, thick white pen on a green rounded-square background.</desc>

  <defs>
    <linearGradient id="note-green" x1="0.12" y1="0.06" x2="0.88" y2="0.94">
      <stop offset="0" stop-color="#1FD596"/>
      <stop offset="0.5" stop-color="#00B87A"/>
      <stop offset="1" stop-color="#009D69"/>
    </linearGradient>
    <g id="pen">
      <rect x="-20" y="-85" width="300" height="170" rx="46"/>
      <path d="M-45 -85 L-45 85 L-185 0 Z" stroke-width="24" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect x="62" y="62" width="900" height="900" rx="210" fill="url(#note-green)"/>

  <!-- Three note lines, darker green. -->
  <g fill="#006E4C" fill-opacity="0.45">
    <rect x="214" y="302" width="596" height="56" rx="28"/>
    <rect x="214" y="484" width="596" height="56" rx="28"/>
    <rect x="214" y="666" width="596" height="56" rx="28"/>
  </g>

  <!-- Pen floats above the lines; offset shadow lifts it. -->
  <g transform="translate(522 528) rotate(-45) scale(1.7 1.3) translate(-41 0)" fill="#004D36" fill-opacity="0.3" stroke="#004D36" stroke-opacity="0.3">
    <use href="#pen"/>
  </g>
  <g transform="translate(512 512) rotate(-45) scale(1.7 1.3) translate(-41 0)" fill="#FFFFFF" stroke="#FFFFFF">
    <use href="#pen"/>
  </g>
</svg>
